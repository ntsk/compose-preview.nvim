name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.neovim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run tests
        run: make test

  render:
    name: render sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('sample/**/*.gradle*', 'sample/gradle/wrapper/gradle-wrapper.properties') }}

      # Keyed on the pinned versions, so a Renovate bump misses the cache and
      # downloads the versions it is actually proposing.
      - name: Cache rendering toolchain
        uses: actions/cache@v4
        with:
          path: .tests/cache
          key: toolchain-${{ hashFiles('lua/compose-preview/toolchain.lua') }}

      - name: Render the sample project
        run: make e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: Run luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: .
